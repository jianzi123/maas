</text>
<text x="950" y="117" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#18334b">
<tspan x="950" dy="0">step 5</tspan>
</text>
<rect x="920" y="145" width="132" height="80" rx="10" fill="#e7f2ff" stroke="#b8c9d9" stroke-width="2"/>
