<text x="30" y="186" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18334b">
<tspan x="30" dy="0">请求A：I=4/O=3</tspan>
</text>
<text x="30" y="293" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18334b">
<tspan x="30" dy="0">请求B：I=2/O=3</tspan>
</text>
<text x="30" y="381" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18334b">
<tspan x="30" dy="0">轮末KV页数</tspan>
</text>
<text x="25" y="435" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#18334b">
<tspan x="25" dy="0">真实系统必须另建成本模型、资源约束与异步完成证据；不能用步数计算TTFT/RPS。</tspan>
</text>
