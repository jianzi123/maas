<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img">
<title>KV所有权：引用归零不等于异步访问已结束</title>
<rect width="1120" height="520" fill="#f7f9fc"/>
<text x="24" y="39" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#18334b">
<tspan x="24" dy="0">KV所有权：引用归零不等于异步访问已结束</tspan>
</text>
<rect x="30" y="115" width="220" height="95" rx="10" fill="#e7f2ff" stroke="#b8c9d9" stroke-width="2"/>
<text x="42" y="141" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18334b">
<tspan x="42" dy="0">请求A</tspan>
<tspan x="42" dy="23">页表[P2, P5]</tspan>
</text>
<rect x="30" y="310" width="220" height="95" rx="10" fill="#e5f6ef" stroke="#b8c9d9" stroke-width="2"/>
<text x="42" y="336" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18334b">
<tspan x="42" dy="0">请求B</tspan>
<tspan x="42" dy="23">页表[P2, P7]</tspan>
</text>
<rect x="415" y="80" width="280" height="95" rx="10" fill="#e5f6ef" stroke="#b8c9d9" stroke-width="2"/>
<text x="427" y="106" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18334b">
<tspan x="427" dy="0">P2：不可变完整prefix</tspan>
<tspan x="427" dy="23">refs 2 → 1，B仍在使用</tspan>
</text>
<rect x="415" y="220" width="280" height="105" rx="10" fill="#fff1d9" stroke="#b8c9d9" stroke-width="2"/>
<text x="427" y="246" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18334b">
<tspan x="427" dy="0">P5：A私有尾页</tspan>
<tspan x="427" dy="23">refs 1 → 0，in_flight=1</tspan>
<tspan x="427" dy="23">先Retiring，不立即复用</tspan>
</text>
<rect x="415" y="365" width="280" height="80" rx="10" fill="#e5f6ef" stroke="#b8c9d9" stroke-width="2"/>
<text x="427" y="391" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18334b">
<tspan x="427" dy="0">P7：B私有尾页</tspan>
<tspan x="427" dy="23">refs=1</tspan>
</text>
<rect x="850" y="225" width="235" height="100" rx="10" fill="#ecebff" stroke="#b8c9d9" stroke-width="2"/>
<text x="862" y="251" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#18334b">
<tspan x="862" dy="0">独立完成事件到达</tspan>
<tspan x="862" dy="23">in_flight → 0</tspan>
<tspan x="862" dy="23">P5才可重新分配</tspan>
</text>
<line x1="250" y1="140" x2="415" y2="125" stroke="#5b7590" stroke-width="3"/>
<polygon points="415.0,125.0 406.4,130.1 405.6,121.5" fill="#5b7590"/>
<line x1="250" y1="340" x2="415" y2="140" stroke="#5b7590" stroke-width="3"/>
<polygon points="415.0,140.0 412.6,149.7 405.9,144.2" fill="#5b7590"/>
<line x1="250" y1="170" x2="415" y2="260" stroke="#5b7590" stroke-width="3"/>
<polygon points="415.0,260.0 405.0,259.5 409.2,251.9" fill="#5b7590"/>
<line x1="250" y1="365" x2="415" y2="400" stroke="#5b7590" stroke-width="3"/>
<polygon points="415.0,400.0 405.3,402.4 407.1,393.9" fill="#5b7590"/>
<line x1="695" y1="272" x2="850" y2="272" stroke="#5b7590" stroke-width="3"/>
<polygon points="850.0,272.0 841.0,276.3 841.0,267.7" fill="#5b7590"/>
<text x="25" y="485" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#18334b">
<tspan x="25" dy="0">generation/fence能识别迟到控制消息，但不能阻止仍在执行的GPU写；真实内存复用须等待完成边界。</tspan>
</text>
</svg>