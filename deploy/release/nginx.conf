pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr $request_method $uri $status $request_time request_id=$upstream_http_x_request_id';
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /readyz { proxy_pass http://maas:8080/readyz; }
    location = /console-config.json {
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }
    location = /api { return 404; }
    location = /v1 { return 404; }
    location /api/ {
      proxy_pass http://maas:8080;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_set_header Accept-Encoding "";
      gzip off;
    }
    location /v1/ {
      proxy_pass http://maas:8080;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 75s;
      proxy_set_header Accept-Encoding "";
      gzip off;
    }
    location /__maas/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}