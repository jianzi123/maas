apiVersion: v1
kind: Service
metadata:
  name: maas
  namespace: maas
spec:
  selector:
    app: maas
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas
  namespace: maas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: maas
  template:
    metadata:
      labels:
        app: maas
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: app
        image: maas-app:__IMAGE_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        args:
        - serve
        - --config
        - /etc/maas/product.json
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 768Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
        - name: app-config
          mountPath: /etc/maas/product.json
          subPath: product.json
          readOnly: true
        - name: console-config
          mountPath: /app/console/console-config.json
          subPath: console-config.json
          readOnly: true
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 60
          periodSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
      volumes:
      - name: secrets
        secret:
          secretName: maas-runtime
      - name: app-config
        configMap:
          name: maas-config
      - name: console-config
        configMap:
          name: maas-console
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: maas
spec:
  selector:
    app: maas-web
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: maas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-web
  template:
    metadata:
      labels:
        app: maas-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
      - name: nginx
        image: maas-web:__IMAGE_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - name: console-config
          mountPath: /usr/share/nginx/html/console-config.json
          subPath: console-config.json
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
      volumes:
      - name: console-config
        configMap:
          name: maas-console
      nodeSelector:
        kubernetes.io/arch: amd64
