{{- range $component := list "operator" "core" "console" }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "maas.name" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "maas.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "maas.selector" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: {{ (index $.Values.network $component).ingress | toJson }}
  egress: {{ (index $.Values.network $component).egress | toJson }}
{{- end }}
{{- end }}