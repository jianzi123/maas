{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "maas.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "maas.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.existingTLSSecret | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ include "maas.name" . }}-core, port: {number: {{ .Values.core.port }}}}
          - path: /v1
            pathType: Prefix
            backend:
              service: {name: {{ include "maas.name" . }}-core, port: {number: {{ .Values.core.port }}}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "maas.name" . }}-console, port: {number: {{ .Values.console.port }}}}
{{- end }}