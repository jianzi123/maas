{{- if .Values.operator.enabled }}
{{- if not .Values.operator.acknowledgeClusterWatch }}{{ fail "operator currently watches all namespaces: acknowledgeClusterWatch required" }}{{ end }}
{{- if not .Values.api.group }}{{ fail "api.group must be explicit" }}{{ end }}
{{- if and (eq .Values.api.group "serving.maas.example") (not .Values.api.reviewPlaceholderAcknowledged) }}{{ fail "placeholder API group requires reviewPlaceholderAcknowledged; never production" }}{{ end }}
{{- end }}
{{- if and .Values.ingress.enabled (not (and .Values.core.enabled .Values.console.enabled)) }}{{ fail "ingress requires core and console" }}{{ end }}
{{- if and (eq .Values.mode "hybrid") (not .Values.higress.externalEgressPolicyRef) }}{{ fail "hybrid requires gateway-owned externalEgressPolicyRef" }}{{ end }}
{{- if and .Values.core.enabled (eq .Values.core.probes.livePath .Values.core.probes.readyPath) }}{{ fail "core readiness must use a separate dependency-aware endpoint" }}{{ end }}
